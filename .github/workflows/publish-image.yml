name: Publish container

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: Publish container images
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Prepare image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ghcr.io/${{ github.repository }}
            agentdockio/nexusdock
          tags: |
            type=sha,prefix=sha-,format=short
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      - name: Build and push image
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=nexusdock-runtime
          cache-to: type=gha,mode=max,scope=nexusdock-runtime,ignore-error=true

      - name: Report published digest
        run: echo "digest=${{ steps.push.outputs.digest }}"

  verify:
    name: Verify published container images
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Resolve verification tag
        id: tag
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "value=latest" >> "$GITHUB_OUTPUT"
          fi

      - name: Pull and run published images
        shell: bash
        env:
          VERIFY_TAG: ${{ steps.tag.outputs.value }}
        run: |
          set -euo pipefail
          images=(
            "ghcr.io/${GITHUB_REPOSITORY}:${VERIFY_TAG}"
            "agentdockio/nexusdock:${VERIFY_TAG}"
          )
          for image in "${images[@]}"; do
            echo "Verifying ${image}"
            docker pull "$image"
            name="nexus-verify-${RANDOM}"
            docker run -d --name "$name" "$image"
            ready=false
            for _ in $(seq 1 30); do
              status="$(docker inspect -f '{{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}' "$name")"
              if [[ "$status" == healthy ]]; then
                ready=true
                break
              fi
              if [[ "$(docker inspect -f '{{.State.Status}}' "$name")" == exited ]]; then
                docker logs "$name"
                exit 1
              fi
              sleep 2
            done
            if [[ "$ready" != true ]]; then
              docker inspect "$name"
              docker logs "$name"
              exit 1
            fi
            docker inspect -f '{{json .RepoDigests}}' "$image"
            docker rm -f "$name"
          done
