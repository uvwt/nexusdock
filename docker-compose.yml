# 官方仓库 Compose 模板：适合 clone 仓库后通过 .env 管理数据路径、端口、公网地址、Trusted Proxies 与镜像。
# README 的快速开始和已有自定义 Compose 同样受支持，不要求迁移到本模板。
# 固定 project name 为 nexusdock，使仓库模板生成的默认网络名称保持稳定。
name: nexusdock

services:
  nexusdock:
    build:
      context: .
      # 与 Dockerfile 的 ARG 缺省一致；本地构建可通过站点 env 注入版本信息，生产直接消费发布镜像。
      args:
        NEXUS_VERSION: ${NEXUS_VERSION:-dev}
        NEXUS_REVISION: ${NEXUS_REVISION:-unknown}
        NEXUS_SOURCE: ${NEXUS_SOURCE:-unknown}
    # 生产用站点 env 固定发布镜像（如 ghcr.io/uvwt/nexusdock:sha-<短SHA>）；
    # 缺省保持本地构建标签，`docker compose build` 行为不变。
    image: ${NEXUS_IMAGE:-nexusdock:local}
    container_name: nexusdock
    restart: unless-stopped
    # 应用优雅关闭最多等待 10s（internal/nexusapp），Docker 默认 10s 就 SIGKILL，刚好可能切断收尾；
    # 给到 30s 保证在途请求与节点连接排空。
    stop_grace_period: 30s
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    ports:
      # 容器内端口固定 18777（镜像 ENV 与 healthcheck 一致），只有宿主机侧是站点差异。
      - "${NEXUS_HTTP_BIND:-127.0.0.1}:${NEXUS_HTTP_PORT:-18777}:18777"
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m,uid=10001,gid=10001,mode=0700
    volumes:
      - ${NEXUS_DATA_DIR:-./nexus-data}:/var/lib/nexus
      - ${RECALL_REPO_DIR:-./recall}:/recall
    environment:
      NEXUS_PUBLIC_URL: ${NEXUS_PUBLIC_URL:-}
      # 留空时自动信任 loopback；仅检测到唯一候选时追加当前容器的 RFC1918 宿主机 bridge 网关；
      # 复杂代理链可显式设置精确 IP/CIDR，并完全覆盖自动默认值。
      NEXUS_TRUSTED_PROXIES: "${NEXUS_TRUSTED_PROXIES:-}"
    # 与 Dockerfile HEALTHCHECK 一致，探针打 /ready（readiness）而不是 /health（liveness）。
    healthcheck:
      test: ["CMD", "wget", "-q", "-T", "2", "-O", "/dev/null", "http://127.0.0.1:18777/ready"]
      interval: 30s
      timeout: 3s
      start_period: 10s
      retries: 3
